<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Minat Bakat SMA | RIASEC Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .question-item {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .options {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        #resultArea { display: none; }
        
        canvas {
            max-width: 100%;
            margin: 20px 0;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Tes Minat Bakat RIASEC</h1>
        <p>Temukan potensi karir masa depanmu berdasarkan kepribadian.</p>
    </div>

    <div id="quizArea" class="card">
        <form id="riasecForm">
            <div id="questionsContainer"></div>
            <button type="button" onclick="calculateResult()">Lihat Hasil Analisis</button>
        </form>
    </div>

    <div id="resultArea" class="card">
        <h2 style="text-align: center;">Profil Kepribadian Anda</h2>
        <canvas id="riasecChart"></canvas>
        <div id="interpretation" class="description"></div>
        <button onclick="location.reload()" style="margin-top: 20px; background: #64748b;">Ulangi Tes</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Saya suka merakit atau memperbaiki peralatan mekanik.", cat: "R" },
        { q: "Saya senang melakukan eksperimen ilmiah.", cat: "I" },
        { q: "Saya menikmati menulis puisi atau cerita pendek.", cat: "A" },
        { q: "Saya suka membantu orang lain menyelesaikan masalah mereka.", cat: "S" },
        { q: "Saya senang memimpin dan mengarahkan kelompok.", cat: "E" },
        { q: "Saya suka menyusun file atau data secara sistematis.", cat: "C" },
        { q: "Saya lebih suka bekerja dengan alat daripada dengan orang.", cat: "R" },
        { q: "Saya senang memecahkan teka-teki logika yang rumit.", cat: "I" },
        { q: "Saya suka menggambar, melukis, atau mendesain sesuatu.", cat: "A" },
        { q: "Mengajar atau melatih orang lain adalah hal yang menyenangkan.", cat: "S" },
        { q: "Saya pandai meyakinkan orang untuk mengikuti ide saya.", cat: "E" },
        { q: "Saya sangat memperhatikan detail dalam laporan keuangan.", cat: "C" },
        { q: "Saya senang bekerja di luar ruangan (outdoor).", cat: "R" },
        { q: "Saya suka membaca jurnal ilmiah atau teknologi.", cat: "I" },
        { q: "Saya senang bermain alat musik atau bernyanyi.", cat: "A" },
        { q: "Saya merasa puas ketika melakukan kegiatan amal.", cat: "S" },
        { q: "Saya bercita-cita menjadi pengusaha atau manajer.", cat: "E" },
        { q: "Saya suka mengikuti aturan dan instruksi yang jelas.", cat: "C" },
        { q: "Saya suka mengoperasikan mesin besar.", cat: "R" },
        { q: "Saya senang menganalisis data statistik.", cat: "I" },
        { q: "Saya suka mencoba gaya berpakaian yang unik.", cat: "A" },
        { q: "Saya senang menjadi tempat curhat teman.", cat: "S" },
        { q: "Saya berani mengambil risiko untuk keuntungan besar.", cat: "E" },
        { q: "Saya suka membuat jadwal harian yang sangat teratur.", cat: "C" }
    ];

    const container = document.getElementById('questionsContainer');
    questions.forEach((item, index) => {
        container.innerHTML += `
            <div class="question-item">
                <p><strong>${index + 1}. ${item.q}</strong></p>
                <div class="options">
                    <label><input type="radio" name="q${index}" value="1" required> Ya</label>
                    <label><input type="radio" name="q${index}" value="0"> Tidak</label>
                </div>
                <input type="hidden" id="cat${index}" value="${item.cat}">
            </div>
        `;
    });

    function calculateResult() {
        const scores = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
        const form = document.forms['riasecForm'];
        
        let answeredAll = true;
        questions.forEach((item, index) => {
            const val = form[`q${index}`].value;
            if (val === "") { answeredAll = false; return; }
            if (val === "1") scores[item.cat]++;
        });

        if (!answeredAll) {
            alert("Harap jawab semua pertanyaan!");
            return;
        }

        document.getElementById('quizArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'block';

        renderChart(scores);
        showInterpretation(scores);
    }

    function renderChart(scores) {
        const ctx = document.getElementById('riasecChart').getContext('2d');
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Realistic', 'Investigative', 'Artistic', 'Social', 'Enterprising', 'Conventional'],
                datasets: [{
                    label: 'Skor Kepribadian',
                    data: [scores.R, scores.I, scores.A, scores.S, scores.E, scores.C],
                    backgroundColor: 'rgba(37, 99, 235, 0.2)',
                    borderColor: '#2563eb',
                    pointBackgroundColor: '#2563eb'
                }]
            },
            options: {
                scales: {
                    r: { beginAtZero: true, max: 4 }
                }
            }
        });
    }

    function showInterpretation(scores) {
        const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        const top = sorted[0][0];
        
        const info = {
            R: "<b>Realistic:</b> Kamu tipe praktis dan suka bekerja dengan tangan, mesin, atau alam. Karir cocok: Teknik, Pertanian, IT Support.",
            I: "<b>Investigative:</b> Kamu pemikir analitis dan suka riset. Karir cocok: Ilmuwan, Dokter, Analis Data.",
            A: "<b>Artistic:</b> Kamu kreatif dan ekspresif. Karir cocok: Desainer, Penulis, Musisi.",
            S: "<b>Social:</b> Kamu suka menolong dan mengajar. Karir cocok: Psikolog, Guru, Perawat.",
            E: "<b>Enterprising:</b> Kamu persuasif dan berjiwa pemimpin. Karir cocok: Pengusaha, Hukum, Marketing.",
            C: "<b>Conventional:</b> Kamu teratur dan teliti dengan data. Karir cocok: Akuntan, Administrasi, Auditor."
        };

        document.getElementById('interpretation').innerHTML = `
            <h3>Tipe Dominan Anda: ${top}</h3>
            <p>${info[top]}</p>
            <p><i>*Hasil ini adalah gambaran umum untuk membantu eksplorasi minatmu.</i></p>
        `;
    }
</script>

</body>
</html>
