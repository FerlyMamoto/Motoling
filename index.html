<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psikotes Minat Bakat RIASEC</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<div class="container">

<!-- HALAMAN START -->

<div id="startPage" class="card center">

<h1>Psikotes Minat Bakat</h1>

<p>
Tes ini membantu mengetahui minat dan potensi karier kamu
menggunakan model <b>RIASEC</b>.
</p>

<button onclick="startTest()" class="btn">Mulai Tes</button>

</div>


<!-- HALAMAN PERTANYAAN -->

<div id="quizPage" class="card hidden">

<div class="progress-container">
<div id="progressBar"></div>
</div>

<h2 id="questionText"></h2>

<div id="answers" class="answers"></div>

<div class="nav">

<button onclick="prevQuestion()" class="btn-outline">Sebelumnya</button>
<button onclick="nextQuestion()" class="btn">Selanjutnya</button>

</div>

</div>


<!-- HALAMAN HASIL -->

<div id="resultPage" class="card hidden">

<h2>Hasil Psikotes Kamu</h2>

<canvas id="resultChart"></canvas>

<div id="scoreList"></div>

<div id="topTypes"></div>

<div id="description"></div>

<div id="majors"></div>

<button onclick="restartTest()" class="btn">Ulangi Tes</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
